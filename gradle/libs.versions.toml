# Libraries used by Forge and its subprojects.
# Most of these are from Minecraft itself. We should really export those as BOM from Mavenizer

[plugins]
forgedev    = { id = "net.minecraftforge.forgedev",        version = "7.0.0-beta.56" }
licenser    = { id = "net.minecraftforge.licenser",        version = "1.2.0" }
versions    = { id = "com.github.ben-manes.versions",      version = "0.54.0" }
gradleutils = { id = "net.minecraftforge.gradleutils",     version = "3.4.9" }
gitversion  = { id = "net.minecraftforge.gitversion",      version = "4.0.0" }
changelog   = { id = "net.minecraftforge.changelog",       version = "3.2.2" }
download    = { id = "de.undercouch.download",             version = "5.6.0" }
jarsigner   = { id = "net.minecraftforge.gradlejarsigner", version = "1.2.1" }
apt         = { id = "com.diffplug.eclipse.apt",           version = "4.4.1" }


[versions]
eventbus     = "7.0.6"
mixinextras  = "0.5.4"
bootstrap    = "2.1.8"
asm          = "9.10.1"
jline        = "3.25.1"
night-config = "3.7.4"
jarjar       = "0.4.2"
log4j        = "2.26.0"
lwjgl        = "3.4.3"
gradle       = "9.7.1" # Gradle we bundle with the MDK

[libraries]
# TODO [Forge][Buildscript We should not be needing to manually add transitive dependencies
#      If we need to make strict versions for dependencies, we should do so using dependency constraints
forgespi           = { module = "net.minecraftforge:forgespi",           version = "8.0.0"  } # Needs modlauncher
modlauncher        = { module = "net.minecraftforge:modlauncher",        version = "10.2.6" } # Needs securemodules
securemodules      = { module = "net.minecraftforge:securemodules",      version = "2.2.24" } # // Needs unsafe
unsafe             = { module = "net.minecraftforge:unsafe",             version = "0.9.2"  }
accesstransformers = { module = "net.minecraftforge:accesstransformers", version = "8.2.17" }
coremods-api       = { module = "net.minecraftforge:coremods-api",       version = "5.3.1"  }
mergetool-api      = { module = "net.minecraftforge:mergetool-api",      version = "1.0"    }
maven-artifact     = { module = "org.apache.maven:maven-artifact",       version = "3.8.8"  } # Used for version comparison

slf4j-api          = { module = "org.slf4j:slf4j-api",                   version = "2.0.17" }

# Annotations
jetbrains-annotations = { module = "org.jetbrains:annotations",       version = "24.0.1" } # ApiStatus annotations
jspecify              = { module = "org.jspecify:jspecify",           version = "1.0.1"  } # Nullability annotations

# Eventbus 
eventbus           = { module = "net.minecraftforge:eventbus",           version.ref = "eventbus" }
eventbus-validator = { module = "net.minecraftforge:eventbus-validator", version.ref = "eventbus" }

# Bootstrap - Converting the process from normal loader into JPMS land
bootstrap      = { module = "net.minecraftforge:bootstrap",      version.ref = "bootstrap" }
bootstrap-api  = { module = "net.minecraftforge:bootstrap-api",  version.ref = "bootstrap" }
bootstrap-dev  = { module = "net.minecraftforge:bootstrap-dev",  version.ref = "bootstrap" }
bootstrap-shim = { module = "net.minecraftforge:bootstrap-shim", version.ref = "bootstrap" }

# ReadOnlyInMemoryFileSystem - Used for JarInJar extraction at runtime
roimfs = { module = "net.minecraftforge:roimfs", version = "1.0.0" }
# Google's InMemory File System. Used by ForgeDev Tests for now, but could be useful for a lot of things. 
# ROIMFS is faster if you need read only
jimfs = { module = "com.google.jimfs:jimfs", version = "1.3.0" }

# Mixin
mixin              = { module = "org.spongepowered:mixin",                version = "0.8.7" }
mixinextras-forge  = { module = "io.github.llamalad7:mixinextras-forge",  version.ref = "mixinextras" }
mixinextras-common = { module = "io.github.llamalad7:mixinextras-common", version.ref = "mixinextras" }

# ASM it's used for so many of our hacks
asm          = { module = "org.ow2.asm:asm",          version.ref = "asm" }
asm-tree     = { module = "org.ow2.asm:asm-tree",     version.ref = "asm" }
asm-util     = { module = "org.ow2.asm:asm-util",     version.ref = "asm" }
asm-commons  = { module = "org.ow2.asm:asm-commons",  version.ref = "asm" }
asm-analysis = { module = "org.ow2.asm:asm-analysis", version.ref = "asm" }

# Terminal Console Appender. essentially make pretty colors in the console, but it's been a PITA
terminalconsoleappender = { module = "net.minecrell:terminalconsoleappender", version = "1.2.0" }
jline-reader       = { module = "org.jline:jline-reader",       version.ref = "jline" }
jline-terminal     = { module = "org.jline:jline-terminal",     version.ref = "jline" }
jline-terminal-jna = { module = "org.jline:jline-terminal-jna", version.ref = "jline" }

# The core of our configuration system, it has many flaws, but it works for the most part
night-config-toml = { module = "com.electronwill.night-config:toml", version.ref = "night-config" }
night-config-core = { module = "com.electronwill.night-config:core", version.ref = "night-config" }

# Jar In Jar FileSystem
jarjar-fs       = { module = "net.minecraftforge:JarJarFileSystems", version.ref = "jarjar" }
jarjar-meta     = { module = "net.minecraftforge:JarJarMetadata",    version.ref = "jarjar" }
jarjar-selector = { module = "net.minecraftforge:JarJarSelector",    version.ref = "jarjar" }

# These are libraries shipped by the MC launcher, try and keep them in sync with the manifest
# but honestly if we don't it just means we ship them as normal libraries by adding them to the installer config in the forge project
gson           = { module = "com.google.code.gson:gson",           version = "2.14.0"     }
guava          = { module = "com.google.guava:guava",              version = "33.6.0-jre" }
failureaccess  = { module = "com.google.guava:failureaccess",      version = "1.0.3"      }
apache-commons = { module = "org.apache.commons:commons-lang3",    version = "3.20.0"     }
mojang-logging = { module = "com.mojang:logging",                  version = "1.7.12"     }
jopt-simple    = { module = "net.sf.jopt-simple:jopt-simple",      version = "5.0.4"      }
commons-io     = { module = "commons-io:commons-io",               version = "2.20.0"     }


log4j-api      = { module = "org.apache.logging.log4j:log4j-api",  version.ref = "log4j" }
log4j-core     = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }

lwjgl          = { module = "org.lwjgl:lwjgl",        version.ref = "lwjgl" }
lwjgl-sdl      = { module = "org.lwjgl:lwjgl-sdl",    version.ref = "lwjgl" }
lwjgl-opengl   = { module = "org.lwjgl:lwjgl-opengl", version.ref = "lwjgl" }
lwjgl-stb      = { module = "org.lwjgl:lwjgl-stb",    version.ref = "lwjgl" }
lwjgl-tinyfd   = { module = "org.lwjgl:lwjgl-tinyfd", version.ref = "lwjgl" }

[bundles]
# Google's InMemory File System. Used by ForgeDev Tests for now, but could be useful for a lot of things.
jimfs                   = ["guava", "failureaccess"]

# ASM it's used for so many of our hacks
asm                     = ["asm", "asm-tree", "asm-util", "asm-commons", "asm-analysis"]

# Pretty colors in the server console
terminalconsoleappender = ["terminalconsoleappender", "jline-reader", "jline-terminal", "jline-terminal-jna"]

# Utility for reading and writing the TOML file format
night-config            = ["night-config-toml", "night-config-core"]

# Bundeling dependencies in a single archive
jarjar                  = ["jarjar-fs", "jarjar-selector", "jarjar-meta"]
log4j                   = ["log4j-api", "log4j-core"]
lwjgl                   = ["lwjgl", "lwjgl-sdl", "lwjgl-opengl", "lwjgl-stb", "lwjgl-tinyfd"]
