import groovy.transform.CompileDynamic
import groovy.transform.CompileStatic
import groovy.transform.PackageScope
import org.gradle.api.plugins.jvm.JvmTestSuite
import org.gradle.api.tasks.CacheableTask
import org.gradle.api.tasks.Input
import org.gradle.api.tasks.InputDirectory
import org.gradle.api.tasks.OutputDirectory
import org.gradle.api.tasks.PathSensitive
import org.gradle.api.tasks.PathSensitivity
import org.gradle.api.tasks.TaskAction
import org.gradle.internal.os.OperatingSystem

import javax.inject.Inject

plugins {
    id 'java-library'
    id 'jvm-test-suite'
    id 'maven-publish'
    alias libs.plugins.licenser
    alias libs.plugins.gradleutils
    alias libs.plugins.gitversion
    alias libs.plugins.changelog
    id 'net.minecraftforge.forge.build.convention'
}

switch (OperatingSystem.current()) {
    case OperatingSystem.LINUX:
        project.ext.lwjglNatives = "natives-linux"
        break
    case OperatingSystem.MAC_OS:
        project.ext.lwjglNatives = "natives-macos"
        break
    case OperatingSystem.WINDOWS:
        project.ext.lwjglNatives = "natives-windows"
        break
}

gradleutils.displayName = 'FML Early Display'
final vendor = 'Forge Development LLC'
description = 'A pretty looking, but prone to erroring screen displayed during Forge loading.'

java {
    toolchain.languageVersion = JavaLanguageVersion.of(javaVersion)
    withSourcesJar()
}

license {
    header = rootProject.file('LICENSE-header.txt')
}

changelog {
    from changelogBase
}

dependencies {
    compileOnly libs.jetbrains.annotations

    implementation projects.fmlloader
    implementation projects.fmlcore
    implementation libs.bundles.lwjgl
    implementation libs.lwjgl.vulkan
    implementation earlyDisplayLibs.slf4j.api
    implementation libs.jopt.simple
}

// See gradle/gradle#35070 (https://github.com/gradle/gradle/issues/35070)
// We are making the list of providers first BEFORE mapping them to a provider of the resolved objects so that they can be finalized after configuration.
var lwjglTestLibs = [
        dependencies.variantOf(earlyDisplayTestLibs.lwjgl) { classifier lwjglNatives },
        dependencies.variantOf(earlyDisplayTestLibs.lwjgl.glfw) { classifier lwjglNatives },
        dependencies.variantOf(earlyDisplayTestLibs.lwjgl.opengl) { classifier lwjglNatives },
        dependencies.variantOf(earlyDisplayTestLibs.lwjgl.stb) { classifier lwjglNatives }
].with { list ->
    provider { list.collect { it.get() } }
}

testing.suites.named('test', JvmTestSuite) {
    useJUnitJupiter('5.8.2')

    dependencies {
        implementation earlyDisplayTestLibs.powermock.core
        runtimeOnly earlyDisplayLibs.slf4j.jdk14
        runtimeOnly.bundle lwjglTestLibs
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs << '-Xlint:unchecked'
}

tasks.named('jar', Jar) {
    manifest {
        attributes([
                'Automatic-Module-Name': 'net.minecraftforge.earlydisplay',
                'Forge-Module-Layer'   : 'boot'
        ])
        attributes([
                'Specification-Title'   : gradleutils.displayName.get(),
                'Specification-Vendor'  : vendor,
                'Specification-Version' : '1',
                'Implementation-Title'  : gradleutils.displayName.get(),
                'Implementation-Vendor' : vendor,
                'Implementation-Version': '1.0'
        ], 'net/minecraftforge/fml/earlydisplay/')
    }
}

@CompileStatic
@PackageScope abstract class CompileSpirvShaders extends DefaultTask {
    @InputDirectory
    @PathSensitive(PathSensitivity.ABSOLUTE)
    abstract DirectoryProperty getShaderLocation()

    @Input
    abstract Property<String> getGlslcPath()

    @Input
    abstract Property<String> getTargetEnv()

    @Input
    abstract Property<String> getResourcesPackage()

    @OutputDirectory
    abstract DirectoryProperty getOutputDir()

    @Inject
    CompileSpirvShaders() {}

    @TaskAction
    @CompileDynamic
    void compile() {
        def outBase = outputDir.asFile.get()
        def packagePath = resourcesPackage.get().replace('.', '/')
        def outDir = new File(outBase, packagePath)
        outDir.mkdirs()

        def allowedEndings = ['.vert', '.frag', '.comp', '.geom', '.tesc', '.tese'] as Set
        boolean error = false

        shaderLocation.asFile.get().eachFile { file ->
            if (!allowedEndings.any { file.name.endsWith(it) }) return
            def outFile = new File(outDir, file.name + '.spv')
            def cmd = [glslcPath.get(), "--target-env=${targetEnv.get()}", '-o', outFile.absolutePath, file.absolutePath]
            def proc = Runtime.getRuntime().exec(cmd as String[])
            proc.inputStream.text
            def stderr = proc.errorStream.text
            if (proc.waitFor() != 0) {
                logger.error(stderr)
                error = true
            } else {
                logger.lifecycle("Compiled SPIR-V shader: ${outFile.name}")
            }
        }

        if (error) throw new GradleException('SPIR-V shader compilation failed')
    }
}

tasks.register('compileSpirvShaders', CompileSpirvShaders) {
    shaderLocation = file('src/main/glsl/shaders')
    glslcPath = 'glslc'
    targetEnv = 'vulkan1.0'
    resourcesPackage = 'shaders'
    outputDir = layout.buildDirectory.dir('generated/sources/glslc/resources')
}

sourceSets.main.resources.srcDir tasks.named('compileSpirvShaders')

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

publishing {
    repositories {
        maven gradleutils.publishingForgeMaven
    }

    publications.register('mavenJava', MavenPublication) {
        changelog.publish(it)
        gradleutils.promote(it)

        from components.java

        pom {
            description = project.description

            gradleutils.pom.addRemoteDetails(pom)

            licenses {
                license gradleutils.pom.licenses.LGPLv2_1
            }
        }
    }
}