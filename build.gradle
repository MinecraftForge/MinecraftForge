import net.minecraftsingularity.singularity.tasks.*
import net.minecraftsingularity.gradleutils.PomUtils

plugins {
    id 'net.minecraftsingularity.licenser' version '1.0.1'
    id 'com.github.ben-manes.versions' version '0.46.0'
    id 'net.minecraftsingularity.gradleutils' version '[2.6.4,2.7)'
    id 'eclipse'
    id 'de.undercouch.download' version '5.4.0'
    id 'net.minecraftsingularity.gradle.patcher' version '[6.0.51,6.2)' apply false
    id 'net.minecraftsingularity.gradle.mcp' version '[6.0.51,6.2)' apply false
    id 'net.minecraftsingularity.gradlejarsigner' version '1.0.4'
    //id 'org.barfuin.gradle.taskinfo' version '3.0.1'
}

Util.init() //Init all our extension methods!

ext {
    VERSION = gitversion.getMCTagOffsetBranch(MC_VERSION)
    SINGULARITY_VERSION = VERSION.substring(MC_VERSION.length() + 1)
}

changelog {
    from '64.0'
}

tasks.register('setup') {
    dependsOn ':singularity:extractMapped'
    if (findProject(':clean'))
        dependsOn ':clean:extractMapped'
}

tasks.register('doChecks') {
    dependsOn ':singularity:checkJarCompatibility'
    dependsOn ':singularity:publish'
}

project(':mcp') {
    apply plugin: 'net.minecraftsingularity.gradle.mcp'
    mcp {
        config MC_VERSION + '-' + MCP_VERSION
        pipeline = 'joined'
    }
    repositories {
        mavenLocal()
    }
}

if (System.env.TEAMCITY_VERSION) {
    //Only setup the CI environment if and only if the environment variables are set.
    tasks.named('configureTeamCity').configure {
        doLast {
            println "##teamcity[buildNumber '${project(':forge').version}']"
            println "##teamcity[setParameter name='env.PUBLISHED_JAVA_ARTIFACT_VERSION' value='${project(':forge').version}']"
        }
    }
}
